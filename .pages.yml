# Pages CMS (app.pagescms.org) editor configuration — docs/editing.md.
#
# What is editable here is the words: page prose, practice-area and
# answer articles, attorney bios, the firm record. Routes, layout,
# navigation, and build flags stay in code. Every save is a commit to
# `main`, which deploys the live site within a few minutes.

media:
  input: packages/site/public/images
  output: /images
  categories: [image]
  rename: safe

settings:
  commit:
    identity: user
    templates:
      create: "Create {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS)"

components:
  # Shared by practice areas and answer pages.
  searchTitle:
    type: string
    label: Search title
    description: Shown in the browser tab and in Google results.
    required: true
  searchDescription:
    type: text
    label: Search description
    description: One or two sentences shown under the title in Google results (about 150 characters).
    required: true
    options:
      maxlength: 200
  draft:
    type: boolean
    label: Draft (not published)
    description: While checked, the page is not built and does not exist on the live site. Uncheck only after attorney legal review.
    default: true
  publishDate:
    type: date
    label: Publish date
    default: ""
    options:
      format: yyyy-MM-dd
  legalReviewDate:
    type: date
    label: Last legally reviewed
    description: Set by the reviewing attorney; shown on the page as "Last legally reviewed".
    default: ""
    options:
      format: yyyy-MM-dd
  related:
    type: string
    label: Related pages
    description: Site paths, one per line — e.g. /personal-injury/car-accidents/
    list: true
    pattern:
      regex: "^/.*/$"
      message: "Site path starting and ending with / (e.g. /personal-injury/car-accidents/)"
  body:
    type: rich-text
    label: Body
    options:
      format: markdown
  link:
    type: string
    label: Link (site path)
    required: true
    pattern:
      regex: "^/.*/$"
      message: "Site path starting and ending with / (e.g. /contact/)"
  button:
    type: object
    label: Button
    fields:
      - name: label
        type: string
        label: Button text
        required: true
      - name: link
        component: link
  photo:
    type: image
    label: Photo
    required: true
    options:
      extensions: [jpg, jpeg, png, webp, svg]
  photoAlt:
    type: string
    label: Photo description
    description: Read aloud by screen readers; describe the picture in a few words.
    required: true

content:
  - name: pages
    label: Pages
    type: collection
    path: packages/site/src/content/pages
    format: yaml-frontmatter
    exclude: [home.md, contact.md]
    view:
      fields: [title, noindex]
      primary: title
    # Each file matches a route in code; new/renamed/deleted files would
    # be ignored or break the build.
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        type: string
        label: Page heading
        required: true
      - name: searchTitle
        type: string
        label: Search title
        description: Optional. Browser-tab / Google title when it should differ from the heading.
      - name: description
        component: searchDescription
      - name: noindex
        type: boolean
        label: Hide from search engines
        description: Keep checked while the page is pending review. The page is still live at its address.
        default: false
      - name: notice
        type: text
        label: Notice
        description: Optional. Shown in a highlighted box above the text (e.g. "Draft — pending attorney review").
      - name: body
        component: body

  - name: home
    label: Homepage
    type: file
    path: packages/site/src/content/pages/home.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        type: string
        label: Main heading
        required: true
      - name: searchTitle
        type: string
        label: Search title
        description: Browser-tab / Google title.
      - name: description
        component: searchDescription
      - name: body
        component: body
        label: Introduction
        description: The sentence or two under the main heading.
      - name: hero
        type: object
        label: Top banner
        fields:
          - name: eyebrow
            type: string
            label: Small line above the heading
          - name: aside
            type: string
            label: Side note
            description: Short italic line at the right of the banner.
          - name: primary
            component: button
            label: Main button
          - name: secondary
            component: button
            label: Second button
          - name: image
            component: photo
            label: Background photo
          - name: imageAlt
            component: photoAlt
      - name: practice
        type: object
        label: Practice Areas section
        description: The two cards themselves are edited under "Practice area cards".
        fields:
          - name: heading
            type: string
            required: true
          - name: subheading
            type: string
      - name: values
        type: object
        label: Four values
        list:
          min: 4
          max: 4
          collapsible:
            summary: "{label}"
        fields:
          - name: icon
            type: select
            required: true
            options:
              values:
                - value: shield
                  label: Shield
                - value: scales
                  label: Scales
                - value: people
                  label: People
                - value: florida
                  label: Florida
          - name: label
            type: string
            required: true
      - name: about
        type: object
        label: About section
        fields:
          - name: eyebrow
            type: string
            label: Small line above the heading
          - name: heading
            type: string
            required: true
          - name: text
            type: text
            required: true
          - name: points
            type: string
            label: Checkmark points
            list: true
          - name: button
            component: button
          - name: image
            component: photo
          - name: imageAlt
            component: photoAlt
      - name: cta
        type: object
        label: Consultation band
        fields:
          - name: eyebrow
            type: string
            label: Small line above the heading
          - name: heading
            type: string
            required: true
          - name: text
            type: text
          - name: button
            component: button
          - name: image
            component: photo
            label: Background photo
          - name: imageAlt
            component: photoAlt

  - name: contact
    label: Contact page
    type: file
    path: packages/site/src/content/pages/contact.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        type: string
        label: Page heading
        required: true
      - name: searchTitle
        type: string
        label: Search title
        description: Optional. Browser-tab / Google title when it should differ from the heading.
      - name: description
        component: searchDescription
      - name: noindex
        type: boolean
        label: Hide from search engines
        default: false
      - name: body
        component: body
        label: Introduction
      - name: office
        type: object
        label: Office block
        description: Shown beside the map. The address itself comes from "Firm details".
        fields:
          - name: heading
            type: string
            required: true
          - name: directions
            type: string
            label: Directions link text
            required: true
      - name: form
        type: object
        label: Contact form
        description: The form appears on the homepage and the contact page once a form processor is configured in code.
        fields:
          - name: heading
            type: string
            required: true
          - name: text
            type: text
            label: Line under the heading
          - name: consent
            type: text
            label: Consent line
            description: Shown above the submit button.
            required: true
          - name: button
            type: string
            label: Submit button text
            required: true
          - name: thanks
            type: text
            label: Thank-you message
            description: Replaces the form after a successful send.
            required: true

  - name: practice-cards
    label: Practice area cards
    type: file
    path: packages/site/src/data/practice-areas.json
    format: json
    operations:
      delete: false
    fields:
      - name: cards
        type: object
        label: Cards
        description: The two practice silos as shown on the homepage and the Practice Areas page; the first line of the footer lists their headings.
        list:
          min: 2
          max: 2
          collapsible:
            summary: "{heading}"
        fields:
          - name: heading
            type: string
            required: true
          - name: text
            type: text
            required: true
          - name: link
            component: link
          - name: image
            component: photo
            label: Illustration
          - name: imageAlt
            component: photoAlt
            label: Illustration description

  - name: practice-areas
    label: Practice areas
    type: collection
    path: packages/site/src/content/practice-areas
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, draft, order, legalReviewDate]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    # The filename is the page address (/personal-injury/<filename>/).
    # Unpublish with the Draft box; never rename or delete a live page.
    operations:
      rename: false
      delete: false
    fields:
      - name: title
        component: searchTitle
        label: Title
        description: Page heading; also the browser-tab and Google title.
      - name: description
        component: searchDescription
      - name: draft
        component: draft
      - name: order
        type: number
        label: Order
        description: Position on the Personal Injury page and in the footer; lower first.
        default: 100
      - name: image
        type: image
        label: Illustration
        description: Optional. Themed illustration shown under the heading.
        options:
          extensions: [svg, png, jpg, webp]
      - name: imageAlt
        type: string
        label: Illustration description
        description: Read aloud by screen readers; describe the picture in a few words.
      - name: publishDate
        component: publishDate
      - name: legalReviewDate
        component: legalReviewDate
      - name: related
        component: related
      - name: body
        component: body

  - name: answers
    label: Injury answers
    type: collection
    path: packages/site/src/content/answers
    format: yaml-frontmatter
    filename:
      template: "{question}.md"
      field: create
    view:
      fields: [question, draft, cluster, legalReviewDate]
      primary: question
      sort: [question]
    # Filename = page address (/florida-injury-answers/<filename>/).
    operations:
      rename: false
      delete: false
    fields:
      - name: question
        type: string
        label: Question
        description: The question exactly as a reader would ask it; used as the link text on the answers page.
        required: true
      - name: title
        component: searchTitle
        label: Title
        description: Page heading; also the browser-tab and Google title.
      - name: description
        component: searchDescription
      - name: draft
        component: draft
      - name: directAnswer
        type: rich-text
        label: Direct answer
        description: The short answer, shown in a highlighted box at the top of the page.
        required: true
        options:
          format: markdown
          media: false
      - name: cluster
        type: string
        label: Topic
        description: Optional grouping keyword (e.g. aftermath, pip, adjusters). Not shown on the page.
      - name: publishDate
        component: publishDate
      - name: legalReviewDate
        component: legalReviewDate
      - name: related
        component: related
      - name: body
        component: body

  - name: attorneys
    label: Attorneys
    type: collection
    path: packages/site/src/content/attorneys
    format: yaml-frontmatter
    filename: "{name}.md"
    view:
      fields: [name, title, order]
      primary: name
      sort: [order, name]
    operations:
      rename: false
      delete: false
    fields:
      - name: name
        type: string
        label: Name
        required: true
      - name: title
        type: string
        label: Title
        default: Attorney
      - name: photo
        component: photo
      - name: photoAlt
        component: photoAlt
      - name: barNumber
        type: string
        label: Florida Bar number
        description: Optional. Adds a link to the Florida Bar profile in the page's structured data.
        pattern:
          regex: "^[0-9]*$"
          message: "Digits only"
      - name: phone
        type: string
        label: Phone
        description: Optional. Included in the page's structured data.
      - name: vcard
        type: string
        label: vCard
        description: Optional. Path of the attorney's contact card, e.g. /vcard/jason-meyers.vcf; shows a "Save contact" link under the title. The card files themselves are maintained in code.
      - name: alumni
        type: string
        label: Schools
        description: One per line, for the page's structured data.
        list: true
      - name: order
        type: number
        label: Order
        description: Position on the page; lower first.
        default: 100
      - name: body
        component: body
        label: Biography

  - name: firm
    label: Firm details
    type: file
    path: packages/site/src/data/firm.json
    format: json
    operations:
      delete: false
    fields:
      - name: brand
        type: string
        label: Firm name
        description: "Used in the copyright line, the browser tab and the logo's alt text (\"Meyers & Onatsko\"). The logo artwork itself is not editable here."
        required: true
      - name: brandLine
        type: string
        label: Line under the firm name
        description: "\"Attorneys at Law\" — the logo's alt text and the share image."
        required: true
      - name: entity
        type: string
        label: Firm legal name
        required: true
      - name: attorney
        type: string
        label: Principal attorney
        description: Named as the author of every article and as the firm's founder.
        required: true
      - name: barNumber
        type: string
        label: Principal attorney's Florida Bar number
        required: true
        pattern:
          regex: "^[0-9]+$"
          message: "Digits only"
      - name: phone
        type: string
        label: Phone
        description: "Format: (321) 555-0100. Used everywhere the number appears, including tap-to-call links."
        required: true
        pattern:
          regex: "^\\([0-9]{3}\\) [0-9]{3}-[0-9]{4}$"
          message: "Use the form (321) 555-0100"
      - name: email
        type: string
        label: Intake email
        required: true
        pattern:
          regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: "Must be an email address"
      - name: address
        type: object
        label: Office address
        fields:
          - name: street
            type: string
            required: true
          - name: city
            type: string
            required: true
          - name: region
            type: string
            label: State
            required: true
          - name: zip
            type: string
            label: ZIP
            required: true
      - name: geography
        type: string
        label: Area served
        description: Shown under the firm name in the footer.
        required: true
      - name: hours
        type: object
        label: Office hours
        description: "Shown on the contact page, in the footer, and to Google as the firm's opening hours. Keep these matching the Google Business Profile."
        fields:
          - name: days
            type: select
            label: Days open
            options:
              multiple: true
              values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
            required: true
          - name: opens
            type: string
            label: Opens
            description: "24-hour clock, e.g. 09:00"
            required: true
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: "Use HH:MM, 24-hour"
          - name: closes
            type: string
            label: Closes
            description: "24-hour clock, e.g. 14:00"
            required: true
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: "Use HH:MM, 24-hour"

  - name: snippets
    label: Site-wide text
    type: file
    path: packages/site/src/data/snippets.json
    format: json
    operations:
      delete: false
    fields:
      - name: articleCta
        type: text
        label: Article call-to-action
        description: The paragraph at the end of every practice-area and answer page, above the phone number.
        required: true
      - name: footerNotice
        type: text
        label: Footer notice
        description: The not-legal-advice line at the bottom of every page.
        required: true
