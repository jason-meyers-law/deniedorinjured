<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <!-- Insurance claim letter with a DENIED stamp, in the site palette. -->
  <rect width="480" height="360" fill="#f7f4ef"/>
  <g transform="rotate(-4 240 190)">
    <rect x="130" y="50" width="220" height="280" rx="6" fill="#ffffff" stroke="#1c2130" stroke-width="5"/>
    <g stroke="#1c2130" stroke-width="5" stroke-linecap="round" opacity="0.35">
      <line x1="165" y1="95" x2="255" y2="95"/>
      <line x1="165" y1="120" x2="315" y2="120"/>
      <line x1="165" y1="145" x2="315" y2="145"/>
      <line x1="165" y1="170" x2="290" y2="170"/>
      <line x1="165" y1="230" x2="315" y2="230"/>
      <line x1="165" y1="255" x2="315" y2="255"/>
      <line x1="165" y1="280" x2="270" y2="280"/>
    </g>
    <rect x="272" y="82" width="46" height="18" rx="3" fill="none" stroke="#1c2130" stroke-width="4" opacity="0.5"/>
  </g>
  <g transform="rotate(-14 240 200)">
    <rect x="120" y="165" width="240" height="72" rx="8" fill="none" stroke="#b8642f" stroke-width="7"/>
    <rect x="132" y="177" width="216" height="48" rx="4" fill="none" stroke="#b8642f" stroke-width="3"/>
    <text x="240" y="216" text-anchor="middle" font-family="Quattrocento, Georgia, serif" font-size="40" letter-spacing="6" fill="#b8642f">DENIED</text>
  </g>
</svg>
